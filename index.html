<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>護理師晉升冒險地圖 🍃 動森風</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap');
        :root { --morandi-pink: #F4C2C2; --mint-green: #98FF98; --ac-brown: #8B5E3C; --ac-bg: #fdf6e3; }
        body { font-family: 'Noto Sans TC', sans-serif; background-color: var(--ac-bg); background-image: radial-gradient(#e5d9b6 1px, transparent 1px); background-size: 20px 20px; color: var(--ac-brown); min-height: 100vh; overflow-x: hidden; }
        .ac-card { background: white; border-radius: 40px; border: 4px solid #f0e6cc; box-shadow: 0 8px 0 #e5d9b6; }
        .tab-btn { transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); border-radius: 25px; border: 3px solid transparent; }
        .tab-btn.active { background-color: var(--morandi-pink) !important; color: white !important; border-color: #e8a5a5; transform: translateY(-4px); box-shadow: 0 6px 0 #d69595; }
        .goal-item { cursor: pointer; transition: all 0.2s; border: 3px solid #f0e6cc; border-radius: 20px; background: white; }
        .goal-item.checked { background-color: var(--mint-green) !important; border-color: #7ed97e; color: #2d5a2d; }
        .map-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 12px; padding: 25px; }
        .tile { aspect-ratio: 1; border-radius: 22px; display: flex; align-items: center; justify-content: center; font-weight: 900; cursor: pointer; transition: all 0.2s; background: #fff; border: 3px solid #f0e6cc; box-shadow: 0 4px 0 #e5d9b6; }
        .tile:hover { transform: scale(1.1); background: #fffdf5; }
        .tile.completed { background-color: var(--mint-green) !important; border-color: #7ed97e; box-shadow: 0 4px 0 #6cc76c; color: #2d5a2d; }
        .nurse-container { position: fixed; bottom: 20px; right: 20px; width: 140px; z-index: 9999; cursor: pointer; animation: floating 4s ease-in-out infinite; }
        .nurse-img { width: 100%; height: auto; mix-blend-mode: multiply; filter: drop-shadow(4px 6px 10px rgba(0,0,0,0.1)); }
        .nurse-bubble { position: absolute; top: -65px; right: 10px; background: white; padding: 10px 18px; border-radius: 25px; border: 3px solid var(--morandi-pink); font-size: 14px; font-weight: 900; white-space: nowrap; box-shadow: 0 5px 0 #f0e6cc; opacity: 0; transform: translateY(10px); transition: all 0.4s; pointer-events: none; }
        .nurse-container:hover .nurse-bubble, .nurse-bubble.show { opacity: 1; transform: translateY(0); }
        @keyframes floating { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .heart-particle { position: fixed; pointer-events: none; z-index: 10001; animation: particle-fly 0.8s ease-out forwards; font-size: 20px; }
        @keyframes particle-fly { 0% { transform: translate(-50%, -50%) scale(0); opacity: 1; } 100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.5); opacity: 0; } }
        #achievement-overlay { position: fixed; inset: 0; background: rgba(255, 255, 255, 0.9); z-index: 10002; display: none; align-items: center; justify-content: center; flex-direction: column; }
        .medal-card { background: white; border: 10px solid var(--morandi-pink); border-radius: 50%; width: 300px; height: 300px; display: flex; align-items: center; justify-content: center; flex-direction: column; box-shadow: 0 15px 0 #e8a5a5; animation: medal-bounce 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes medal-bounce { 0% { transform: scale(0); } 80% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .memo-input { background: #fdf6e3; border: 2px dashed #e5d9b6; border-radius: 15px; width: 100%; padding: 12px; font-size: 14px; color: var(--ac-brown); resize: none; outline: none; }
        .btn-system-icon { background: #8B5E3C; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; box-shadow: 0 3px 0 #5d3f28; }
        .btn-system-icon:hover { transform: translateY(-2px); box-shadow: 0 5px 0 #5d3f28; }
        .btn-system-icon:active { transform: translateY(1px); box-shadow: 0 1px 0 #5d3f28; }
    </style>
</head>
<body class="p-4 md:p-8" onclick="createHeartEffect(event)">

    <div class="max-w-5xl mx-auto">
        <header class="ac-card p-8 mb-8 text-center md:text-left relative">
            <div class="flex flex-col md:flex-row justify-between items-center gap-6">
                <div>
                    <h1 class="text-4xl md:text-5xl mb-2 flex items-center gap-3">
                        <span class="text-pink-400">醫院歷險記</span> 
                        <a href="https://amanhung.github.io/Formulary/" target="_blank" title="臨床藥理小實驗瓶"><span class="text-3xl">🧪</span></a>
                    </h1>
                    <div class="flex items-center justify-center md:justify-start gap-4 mt-2">
                        <p class="text-gray-500 font-bold">今天也是充滿朝氣的一天呢，加油！</p>
                        <div class="flex gap-2">
                            <button onclick="exportData()" class="btn-system-icon" title="備份進度">💾</button>
                            <button onclick="importData()" class="btn-system-icon" title="匯入進度">📥</button>
                        </div>
                    </div>
                </div>
                <div class="flex gap-4">
                    <div class="bg-[#fdf6e3] px-6 py-4 rounded-[30px] border-2 border-[#e5d9b6] text-center min-w-[120px]">
                        <p id="progress-label" class="text-xs font-black mb-1 opacity-60">階段進度</p>
                        <p id="total-progress-percent" class="text-3xl font-black text-pink-400">0%</p>
                    </div>
                </div>
            </div>
            <div class="mt-8">
                <div class="w-full h-6 bg-[#f0e6cc] rounded-full p-1 shadow-inner">
                    <div id="progress-bar" class="h-full rounded-full transition-all duration-700 shadow-sm" style="width: 0%; background-color: var(--morandi-pink);"></div>
                </div>
            </div>
        </header>

        <nav class="flex flex-wrap gap-3 mb-8 justify-center">
            <button onclick="switchStage(0); playSound('pop')" class="tab-btn active flex-1 py-3 bg-white text-gray-400 font-black shadow-md" id="btn-n1">N1 萌芽期</button>
            <button onclick="switchStage(1); playSound('pop')" class="tab-btn flex-1 py-3 bg-white text-gray-400 font-black shadow-md" id="btn-n2">N2 成長期</button>
            <button onclick="switchStage(2); playSound('pop')" class="tab-btn flex-1 py-3 bg-white text-gray-400 font-black shadow-md" id="btn-n3">N3 繁花期</button>
            <button onclick="switchStage(3); playSound('pop')" class="tab-btn flex-1 py-3 bg-white text-gray-400 font-black shadow-md" id="btn-n4">N4 巔峰期</button>
        </nav>

        <div class="ac-card p-8 mb-8">
            <h2 id="stage-title" class="text-2xl font-black mb-6">📋 晉升條件</h2>
            <div id="goals-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>

        <div class="ac-card mb-12">
            <div id="game-board" class="map-container"></div>
        </div>
    </div>

    <div class="nurse-container" onclick="triggerNurseTalk(); playSound('ding')">
        <div id="nurse-bubble" class="nurse-bubble">今天也要加油喔！💉</div>
        <img class="nurse-img" src="https://i.ibb.co/xqMkN2ZV/Gemini-Generated-Image-7071157071157071.png">
    </div>

    <div id="overlay" class="fixed inset-0 bg-[#8B5E3C]/20 backdrop-blur-sm hidden z-40" onclick="closeModal()"></div>
    <div id="modal" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[90%] max-w-sm bg-white rounded-[40px] shadow-2xl hidden z-50 p-8 border-8 border-[#f0e6cc]">
        <h2 id="modal-week-title" class="text-4xl font-black text-gray-800 mb-2"></h2>
        <p id="modal-task-desc" class="text-gray-500 mb-4 italic"></p>
        <div class="mb-6">
            <p class="text-xs font-black text-pink-400 mb-2">📒 臨床絕招 Memo</p>
            <textarea id="modal-memo" class="memo-input" rows="3"></textarea>
        </div>
        <button id="complete-btn" onclick="toggleWeekStatus(); playSound('success')" class="w-full py-4 rounded-[25px] font-black text-white text-xl shadow-lg">標記完成！</button>
    </div>

    <div id="achievement-overlay" onclick="this.style.display='none'">
        <div class="medal-card">
            <span class="text-6xl mb-4">🐻</span>
            <h3 class="text-3xl font-black text-pink-400">Congratulation!</h3>
            <p class="text-ac-brown font-bold mt-2">階段完美達成！</p>
        </div>
    </div>

    <script>
        const STAGE_WEEKS = 52;
        let weekProgress = JSON.parse(localStorage.getItem('ac_nursing_weeks')) || [];
        let goalProgress = JSON.parse(localStorage.getItem('ac_nursing_goals')) || {};
        let memoData = JSON.parse(localStorage.getItem('ac_nursing_memos')) || {};
        let currentStageIndex = 0;
        let currentEditingWeek = null;

        const stageConfig = [
            { id: 'n1', label: 'N1 萌芽期', range: [1, 52], task: "熟悉環境及流程，執行一般護理。", goals: ["📖 N1訓練滿15小時", "📄 讀書報告5小時", "✅ 讀書報告審查合格", "🧑‍⚕️ 個別護理指導", "🛠️ 管理設備醫材"] },
            { id: 'n2', label: 'N2 成長期', range: [53, 104], task: "照護重症病人，指導新進人員。", goals: ["📖 N2訓練滿15小時", "🧪 學術活動滿5小時", "📝 案例分析或實證", "🏥 重症病人護理", "🤝 指導護生或新進人員", "📊 參與護理品管活動"] },
            { id: 'n3', label: 'N3 繁花期', range: [105, 156], task: "主講教育課程，獨立指導新人。", goals: ["📖 N3訓練滿15小時", "🧪 學術活動滿5小時", "📑 個案報告或實務文章", "🎤 主講教育課程", "🔍 指導護生或新人", "🚩 執行品管活動"] },
            { id: 'n4', label: 'N4 巔峰期', range: [157, 208], task: "專科進階護理，擔任組長或主持會議。", goals: ["📖 N4訓練滿15小時", "🧪 學術活動滿5小時", "🏆 專案/研究文章", "💎 專科進階護理", "👑 指導護生或新人", "🚩 擔任組長或主持會議"] }
        ];

        function playSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                
                if (type === 'pop') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                } else if (type === 'ding') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                } else if (type === 'success') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1046.5, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                }
                
                osc.start(); 
                osc.stop(ctx.currentTime + 0.3);
            } catch(e){}
        }

        function createHeartEffect(e) {
            const items = ['🌸', '✨', '💖'];
            for (let i = 0; i < 6; i++) {
                const p = document.createElement('div');
                p.className = 'heart-particle';
                p.style.left = e.clientX + 'px'; p.style.top = e.clientY + 'px';
                p.style.setProperty('--tx', (Math.random() - 0.5) * 150 + 'px');
                p.style.setProperty('--ty', (Math.random() - 0.5) * 150 + 'px');
                p.innerHTML = items[Math.floor(Math.random() * items.length)];
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 800);
            }
        }

        function switchStage(index) {
            currentStageIndex = index;
            document.querySelectorAll('.tab-btn').forEach((btn, i) => btn.classList.toggle('active', i === index));
            const stage = stageConfig[index];
            document.getElementById('stage-title').innerText = `📋 ${stage.label} 晉升條件`;
            const list = document.getElementById('goals-list');
            list.innerHTML = stage.goals.map((g, i) => {
                const id = `${stage.id}_${i}`;
                return `<div class="goal-item p-4 flex items-center gap-3 ${goalProgress[id] ? 'checked' : ''}" onclick="toggleGoal('${id}')"><span class="text-sm font-black">${g}</span></div>`;
            }).join('');
            renderBoard(); updateGlobalUI();
        }

        function toggleGoal(id) {
            goalProgress[id] = !goalProgress[id];
            localStorage.setItem('ac_nursing_goals', JSON.stringify(goalProgress));
            if (goalProgress[id]) {
                playSound('success');
                confetti({ particleCount: 50 });
            } else {
                playSound('pop');
            }
            switchStage(currentStageIndex);
        }

        function renderBoard() {
            const board = document.getElementById('game-board');
            board.innerHTML = '';
            const stage = stageConfig[currentStageIndex];
            for (let i = stage.range[0]; i <= stage.range[1]; i++) {
                const isComp = weekProgress.includes(i);
                const tile = document.createElement('div');
                tile.className = `tile ${isComp ? 'completed' : ''}`;
                tile.innerHTML = isComp ? '🌸' : i;
                tile.onclick = (e) => { 
                    e.stopPropagation(); 
                    playSound('pop'); // 日期按鈕點擊聲音
                    openModal(i); 
                };
                board.appendChild(tile);
            }
        }

        function openModal(week) {
            currentEditingWeek = week;
            const stage = stageConfig.find(s => week >= s.range[0] && week <= s.range[1]);
            const isComp = weekProgress.includes(week);
            document.getElementById('modal-week-title').innerText = `第 ${week} 週`;
            document.getElementById('modal-task-desc').innerText = stage.task;
            document.getElementById('modal-memo').value = memoData[week] || "";
            const btn = document.getElementById('complete-btn');
            btn.innerText = isComp ? '取消紀錄' : '標記完成！';
            btn.style.backgroundColor = isComp ? '#ccc' : 'var(--morandi-pink)';
            document.getElementById('overlay').classList.remove('hidden');
            document.getElementById('modal').classList.remove('hidden');
        }

        function toggleWeekStatus() {
            const memo = document.getElementById('modal-memo').value;
            if (memo) memoData[currentEditingWeek] = memo;
            else delete memoData[currentEditingWeek];
            localStorage.setItem('ac_nursing_memos', JSON.stringify(memoData));

            if (weekProgress.includes(currentEditingWeek)) weekProgress = weekProgress.filter(w => w !== currentEditingWeek);
            else { weekProgress.push(currentEditingWeek); confetti({ particleCount: 80 }); }
            localStorage.setItem('ac_nursing_weeks', JSON.stringify(weekProgress));

            closeModal(); renderBoard(); updateGlobalUI();
        }

        function updateGlobalUI() {
            const stage = stageConfig[currentStageIndex];
            const comp = weekProgress.filter(w => w >= stage.range[0] && w <= stage.range[1]).length;
            const pct = ((comp / STAGE_WEEKS) * 100).toFixed(1);
            document.getElementById('total-progress-percent').innerText = `${pct}%`;
            document.getElementById('progress-bar').style.width = `${pct}%`;
        }

        function closeModal() { document.getElementById('overlay').classList.add('hidden'); document.getElementById('modal').classList.add('hidden'); }
        
        function triggerNurseTalk() {
            const bubble = document.getElementById('nurse-bubble');
            const lines = ["加油加油！💉", "累了就休息一下 ☕", "妳最棒了 ✨"];
            bubble.innerText = lines[Math.floor(Math.random() * lines.length)];
            bubble.classList.add('show');
            setTimeout(() => bubble.classList.remove('show'), 3000);
        }

        // --- GitHub 專屬備份功能 ---
        function exportData() {
            const allData = { weeks: weekProgress, goals: goalProgress, memos: memoData };
            const dataStr = JSON.stringify(allData);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `護理地圖備份_${new Date().toLocaleDateString()}.json`;
            a.click();
            alert("備份檔已下載！請存好這個檔案。");
        }

        function importData() {
            const input = prompt("請貼上備份檔案中的內容 (JSON 字串)：");
            if (!input) return;
            try {
                const data = JSON.parse(input);
                if (data.weeks) {
                    weekProgress = data.weeks; goalProgress = data.goals; memoData = data.memos;
                    localStorage.setItem('ac_nursing_weeks', JSON.stringify(weekProgress));
                    localStorage.setItem('ac_nursing_goals', JSON.stringify(goalProgress));
                    localStorage.setItem('ac_nursing_memos', JSON.stringify(memoData));
                    alert("匯入成功！"); location.reload();
                }
            } catch(e) { alert("格式錯誤！"); }
        }

        init = () => switchStage(0);
        init();
    </script>
</body>
</html>
